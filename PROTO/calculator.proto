syntax = "proto3";

option java_outer_classname = "CalculatorProto";

message CalcRequest {
  int32 sequence = 1;
  double operand1 = 2;
  string operator = 3;
  double operand2 = 4;
}

message CalcResponse {
  int32 sequence = 1;
  bool success = 2;
  double result = 3;
  string error_message = 4;
}
